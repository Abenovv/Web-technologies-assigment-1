<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Contact</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="navbar"></div>
        <div class="contact">
            <h1>Contact</h1>
            <p>
                Our contact:
                <ul>
                    <li>Phone: +7-705-375-7115</li>
                    <li>Instagram: abenovv7</li>
                    <li>Mail: Book.library@online.com</li>
                </ul>
            </p>

            <form><div class="form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Write your name"></input>
                
                <br><br>

                <label for="gmail">Gmail</label>
                <input type="email" id="gmail" name="gmail" placeholder="example@gmail.com">

                <br><br>

                <label for="phone">Phone</label>
                <input type="phone" id="phone" name="phone" placeholder="8-705-375-7115"
                pattern="[0-9]{10}" required
                >
                
                <br><br>

                <label for="date">Date</label>
                <input type="date" id="date" name="date">

                <br><br>

                <label for="question">Are you working?</label>
                <input type="checkbox" id="question" name="question" required>
                
                <br><br>

                <button type="submit" style="display: block; margin: 10px 50px;">Submit</button>
                </div>
            </form>
            <form>
                <p>Choose your level:</p>

                <input type="radio" id="beginner" name="level" value="beginner">
                <label for="beginner">Beginner</label>

                <input type="radio" id="middle" name="level" value="middle">
                <label for="middle">Middle</label>

                <input type="radio" id="advanced" name="level" value="middle">
                <label for="advanced">Advanced</label>

                <button style="margin: 10px;">Submit</button>
            </form>
        </div>

        <script>
            async function loadNav(){
                const response = await fetch("index.html");
                const text = await response.text();

                const parser = new DOMParser();
                const page = parser.parseFromString(text, "text/html");

                const nav = page.querySelector("nav");

                document.getElementById("navbar").innerHTML = nav.outerHTML;
            }

            loadNav();
        </script>
    </body>
</html>
